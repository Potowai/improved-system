services:
  - type: web
    name: improved-system
    env: python
    region: frankfurt # change to oregon/singapore as needed
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
